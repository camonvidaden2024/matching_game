<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đường Đến Tri Thức</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            position: relative;
            overflow: hidden;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            display: block;
            margin: 20px auto 0;
        }
        button:hover {
            background-color: #2980b9;
        }
        
        /* CSS Vòng 2 - Đường đua thỏ */
        #r2-track {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #a8e6cf;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 3px solid #81c784;
        }
        #r2-road {
            position: absolute;
            top: 90px;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #d7ccc8;
            border-top: 4px dashed #a1887f;
            border-bottom: 4px dashed #a1887f;
        }
        
        /* Cấu hình hiển thị HÌNH ẢNH trong Vòng 2 */
        #rabbit {
            position: absolute;
            top: 75px;
            left: 20px;
            transition: left 0.5s ease-in-out;
            z-index: 10;
        }
        #rabbit img {
            width: 70px;
            height: auto;
            display: block;
        }
        
        .rock {
            position: absolute;
            top: 95px;
            z-index: 5;
        }
        .rock img {
            width: 50px;
            height: auto;
            display: block;
        }
        
        #finish-line {
            position: absolute;
            top: 65px;
            right: 20px;
            z-index: 5;
        }
        #finish-line img {
            width: 65px;
            height: auto;
            display: block;
        }

        .decor {
            position: absolute;
            font-size: 24px;
        }

        /* Khung câu hỏi & đáp án */
        .question-box {
            font-size: 18px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 15px;
            text-align: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .option-btn {
            background-color: #ecf0f1;
            color: #2c3e50;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #bdc3c7;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
            margin: 0;
            width: 100%;
        }
        .option-btn:hover {
            background-color: #d5dbdb;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="screen-start" class="screen active">
        <h1>BẮT ĐẦU TRÒ CHƠI</h1>
        <p style="text-align: center; color: #555;">Chào mừng bạn đến với chặng đua trí tuệ! Hãy cùng Thỏ vượt qua các tảng đá để về đích nhé.</p>
        <button onclick="startRound2()">Bắt đầu Vòng 2</button>
    </div>

    <!-- MÀN HÌNH VÒNG 2: THỎ CHẠY ĐƯỜNG ĐUA -->
    <div id="screen-r2" class="screen">
        <div class="status-bar">
            <span>Vòng 2: Thỏ Vượt Rào Chắn</span>
            <span id="r2-score">Câu: 1/5</span>
        </div>

        <!-- ĐƯỜNG ĐUA THỎ VỚI HÌNH ẢNH -->
        <div id="r2-track">
            <div class="decor" style="top:10px; left:10%;">🌸</div>
            <div class="decor" style="top:190px; left:30%;">🌳</div>
            <div class="decor" style="top:20px; left:60%;">🌻</div>
            <div class="decor" style="top:180px; left:80%;">🌲</div>
            
            <div id="r2-road"></div>
            
            <!-- Ảnh vạch đích -->
            <div id="finish-line">
                <img src="finish.png" alt="Vạch đích">
            </div>
            
            <!-- Các tảng đá sẽ được JavaScript tạo tự động ở đây -->
            
            <!-- Ảnh chú thỏ -->
            <div id="rabbit">
                <img src="rabbit.png" alt="Thỏ">
            </div>
        </div>

        <!-- KHUNG CÂU HỎI -->
        <div class="question-box" id="r2-question">
            Câu hỏi sẽ xuất hiện ở đây...
        </div>
        <div class="options-grid" id="r2-options">
            <!-- Các nút đáp án -->
        </div>
    </div>

    <!-- MÀN HÌNH KẾT THÚC -->
    <div id="screen-end" class="screen">
        <h1>🎉 CHÚC MỪNG BẠN ĐÃ HOÀN THÀNH! 🎉</h1>
        <p style="text-align: center; font-size: 18px;" id="end-message">Thỏ đã xuất sắc vượt qua tất cả vật cản để về đích!</p>
        <button onclick="location.reload()">Chơi Lại</button>
    </div>
</div>

<script>
    // Danh sách câu hỏi mẫu cho Vòng 2
    const round2Questions = [
        {
            question: "1 + 1 bằng bao nhiêu?",
            options: ["1", "2", "3", "4"],
            answer: 1
        },
        {
            question: "Thủ đô của Việt Nam là gì?",
            options: ["Đà Nẵng", "Hồ Chí Minh", "Hà Nội", "Cần Thơ"],
            answer: 2
        },
        {
            question: "Con vật nào dưới đây chạy nhanh nhất?",
            options: ["Rùa", "Ốc sên", "Báo gấm", "Thỏ"],
            answer: 2
        },
        {
            question: "Một năm có bao nhiêu tháng?",
            options: ["10 tháng", "11 tháng", "12 tháng", "13 tháng"],
            answer: 2
        },
        {
            question: "Mặt trời mọc ở hướng nào?",
            options: ["Hướng Đông", "Hướng Tây", "Hướng Nam", "Hướng Bắc"],
            answer: 0
        }
    ];

    let currentQuesIndex = 0;
    const totalQues = round2Questions.length;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startRound2() {
        showScreen('screen-r2');
        currentQuesIndex = 0;
        initRound2Track();
        loadQuestion();
    }

    // Tạo chướng ngại vật (tảng đá) bằng ảnh rock.png
    function initRound2Track() {
        const track = document.getElementById('r2-track');
        
        // Xóa các tảng đá cũ nếu có
        document.querySelectorAll('.rock').forEach(r => r.remove());
        
        // Đặt lại vị trí ban đầu cho thỏ
        document.getElementById('rabbit').style.left = '20px';

        // Tạo các tảng đá mới dải đều trên đường đua
        for (let i = 0; i < totalQues; i++) {
            let rock = document.createElement('div');
            rock.className = 'rock';
            rock.id = 'rock-' + i;
            
            // Thay emoji bằng thẻ <img> trỏ đến file ảnh tảng đá
            rock.innerHTML = '<img src="rock.png" alt="Tảng đá">';
            
            // Tính toán khoảng cách vị trí từng tảng đá
            let positionPercent = 20 + ((i + 1) * (65 / totalQues));
            rock.style.left = positionPercent + '%';
            
            track.appendChild(rock);
        }
    }

    function loadQuestion() {
        if (currentQuesIndex >= totalQues) {
            // Thỏ nhảy vào vạch đích
            document.getElementById('rabbit').style.left = '85%';
            setTimeout(() => {
                showScreen('screen-end');
            }, 600);
            return;
        }

        document.getElementById('r2-score').innerText = `Câu: ${currentQuesIndex + 1}/${totalQues}`;
        const q = round2Questions[currentQuesIndex];
        document.getElementById('r2-question').innerText = q.question;

        const optionsContainer = document.getElementById('r2-options');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex) {
        const q = round2Questions[currentQuesIndex];
        
        if (selectedIndex === q.answer) {
            alert("Chính xác! Thỏ tiến lên một bước.");
            
            // Phá hủy tảng đá tương ứng
            const rock = document.getElementById('rock-' + currentQuesIndex);
            if (rock) rock.style.display = 'none';

            // Di chuyển thỏ tiến lên
            currentQuesIndex++;
            let nextPos = 20 + (currentQuesIndex * (65 / totalQues));
            document.getElementById('rabbit').style.left = nextPos + '%';

            loadQuestion();
        } else {
            alert("Sai rồi, hãy thử lại nhé!");
        }
    }
</script>

</body>
</html>
